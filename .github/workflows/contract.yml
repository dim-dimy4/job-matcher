name: Contract tests

# Live checks that DOU and Himalayas still return the fields the parsers expect (SPEC §9).
# Kept out of CI: a change on a job board is not a reason to block a pull request.
on:
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Contract tests
        run: pytest -m contract -v
