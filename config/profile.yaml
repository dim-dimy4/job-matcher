# Candidate profile: the matcher's input (SPEC §2). Data only; scoring rules live in matcher.py.
# Keywords are matched case-insensitively as whole words ("API" also matches "APIs").

# A title must contain one of these, otherwise the vacancy is not a QA role (score 0).
role_keywords:
  - QA
  - AQA
  - SDET
  - engineer in test
  - quality assurance
  - quality engineer
  - test automation
  - automation tester
  - test engineer
  - tester

# On-site / hybrid is fine only in these cities; remote is fine anywhere the post allows.
cities:
  - Wrocław
  - Wroclaw
  - Вроцлав

# A remote post earns +10 only if its location names one of these (or a city above):
# on DOU "віддалено" from Kyiv/Lviv often means "from Ukraine". Otherwise: "check location".
remote_locations:
  - Poland
  - Польща
  - Polska
  - EU
  - Europe
  - Європа
  - за кордоном
  - Worldwide

# +5 each, at most +30. Distinctive skills only: generic tools (Jira, Git) match every post.
plus_keywords:
  # automation
  - Playwright
  - Python
  - Pytest
  - Selenium
  - GitHub Actions
  # API and data
  - API
  - Postman
  - Newman
  - SQL
  # AI / LLM testing
  - LLM
  - AI
  - GenAI
  - prompt injection
  # domain
  - Stripe
  - payments
  - SaaS
  - startup
  - e-commerce
  - marketplace

# Any of these anywhere in the post: score 0.
minus_keywords:
  - gambling
  - casino
  - iGaming
  - betting
  # languages the candidate doesn't speak at work level
  - German-speaking
  - fluent German

# In the title only: another stack or domain is the main job. Kept out of minus_keywords,
# where "hardware" or "performance" in a description would reject good posts.
title_minus_keywords:
  - ASIC
  - FPGA
  - embedded
  - hardware
  - firmware
  - Golang
  - performance
  - load testing

# Monthly salary thresholds in one base currency; USD/EUR are converted by the rates.
# Compared with the top of the range. No salary in the post: not filtered, no bonus.
# The values below are EXAMPLES. The real ones come from the SALARY_MINIMUM and
# SALARY_TARGET environment variables (GitHub Secrets in CI, .env locally).
salary:
  currency: PLN
  minimum: 12000 # below: score 0
  target: 16000 # at or above: +10
  rates: # approximate, 1 unit in PLN
    USD: 3.7
    EUR: 4.25

# Vacancies scoring at least this go to Telegram.
notify_threshold: 70
